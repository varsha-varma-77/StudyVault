<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Authentication | StudyVault</title>
  <meta name="description" content="Sign in or register for StudyVault to share and organize university course materials.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Top Bar Contract -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <span>StudyVault</span>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="resources.html" class="nav-link">Resources</a>
        <a href="upload.html" class="nav-link">Upload</a>
        <a href="profile.html" class="nav-link">Profile</a>
      </nav>

      <div class="header-actions">
        <a href="upload.html" class="btn btn-primary btn-sm header-cta">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          </svg>
          <span>Share Notes</span>
        </a>
        <button id="mobileMenuToggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Panel -->
  <div id="mobileNavPanel" class="mobile-nav-panel">
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="resources.html" class="mobile-nav-link">Resources</a>
      <a href="upload.html" class="mobile-nav-link">Upload</a>
      <a href="profile.html" class="mobile-nav-link">Profile</a>
      <a href="auth.html" class="mobile-nav-link active">Sign In / Register</a>
    </div>
  </div>

  <main>
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-header">
          <h1 id="authTitle" class="auth-title font-heading">Sign In</h1>
          <p id="authSubtitle" class="auth-subtitle">Access your personal vault and course notes.</p>
        </div>

        <!-- Auth Tabs Toggle -->
        <div class="auth-tabs">
          <button type="button" id="tabLogin" class="auth-tab-btn active">Sign In</button>
          <button type="button" id="tabSignup" class="auth-tab-btn">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form">
          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="loginEmail" class="form-label">College Email</label>
            <input
              type="email"
              id="loginEmail"
              class="form-input"
              placeholder="student@campus.edu"
              value="test@gmail.com"
              required
            >
          </div>

          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="loginPassword" class="form-label">Password</label>
            <input
              type="password"
              id="loginPassword"
              class="form-input"
              placeholder="••••••••"
              value="test@123"
              required
            >
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            Sign In to StudyVault
          </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form" style="display: none;">
          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="signupName" class="form-label">Full Name</label>
            <input
              type="text"
              id="signupName"
              class="form-input"
              placeholder="e.g. Maya Lin"
              required
            >
          </div>

          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="signupEmail" class="form-label">College Email</label>
            <input
              type="email"
              id="signupEmail"
              class="form-input"
              placeholder="student@campus.edu"
              required
            >
          </div>

          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="signupCollege" class="form-label">College / University</label>
            <input
              type="text"
              id="signupCollege"
              class="form-input"
              placeholder="e.g. Institute of Technology"
              required
            >
          </div>

          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="signupDept" class="form-label">Department</label>
            <select id="signupDept" class="filter-select" required>
              <option value="Computer Science">Computer Science</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Electrical">Electrical</option>
              <option value="Mechanical">Mechanical</option>
              <option value="General Studies">General Studies</option>
            </select>
          </div>

          <div class="form-field" style="margin-bottom: 0.75rem;">
            <label for="signupPassword" class="form-label">Create Password</label>
            <input
              type="password"
              id="signupPassword"
              class="form-input"
              placeholder="Minimum 6 characters"
              required
            >
          </div>

          <button type="submit" id="signupSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            Create Student Account
          </button>
        </form>

        <div class="auth-demo-box">
          Ready to connect to Node.js / MongoDB backend. Demo account pre-loaded for rapid testing.
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
